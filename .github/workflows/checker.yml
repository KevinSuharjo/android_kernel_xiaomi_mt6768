name: Check String Props & MT6768 Battery DTSI

on:
  workflow_dispatch:

jobs:
  check-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Kernel Tree
        uses: actions/checkout@v4
        with:
          repository: 'mt6768-dev/android_kernel_xiaomi_mt6768'
          ref: 'lineage-23.2'
          fetch-depth: 1

      - name: 1. Check MODEL_NAME to SERIAL_NUMBER handlers
        run: |
          echo "=== GrepPROP_BATTERY_TYPE / PTMC_ID / CYCLE_COUNTS / MODEL_NAME ==="
          grep -rn -C 4 "POWER_SUPPLY_PROP_BATTERY_TYPE\|POWER_SUPPLY_PROP_PTMC_ID\|POWER_SUPPLY_PROP_CYCLE_COUNTS\|POWER_SUPPLY_PROP_MODEL_NAME" drivers/power/supply/ || true

      - name: 2. Dump power_supply_sysfs.c (Lines 380-480)
        run: |
          echo "=== drivers/power/supply/power_supply_sysfs.c (Lines 380-480) ==="
          nl -ba drivers/power/supply/power_supply_sysfs.c | sed -n '380,480p'

      - name: 3. Dump mt6768_battery_prop.dtsi & merlin battery
        run: |
          echo "=== arch/arm64/boot/dts/mediatek/bat_setting/mt6768_battery_prop.dtsi ==="
          nl -ba arch/arm64/boot/dts/mediatek/bat_setting/mt6768_battery_prop.dtsi
          echo "=== Check files inside arch/arm64/boot/dts/mediatek/merlin ==="
          ls -la arch/arm64/boot/dts/mediatek/merlin* || true
