name: Check Array Bounds & Merlin Battery DTS

on:
  workflow_dispatch:

jobs:
  check-bounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Kernel Tree
        uses: actions/checkout@v4
        with:
          repository: 'mt6768-dev/android_kernel_xiaomi_mt6768'
          ref: 'lineage-23.2'
          fetch-depth: 1

      - name: 1. Dump power_supply_sysfs.c (Lines 1-145) & include/linux/power_supply.h
        run: |
          echo "=== drivers/power/supply/power_supply_sysfs.c (Lines 1-145) ==="
          nl -ba drivers/power/supply/power_supply_sysfs.c | sed -n '1,145p'
          echo "=== power_supply_type enum in include/linux/power_supply.h ==="
          grep -n -C 35 "POWER_SUPPLY_TYPE_USB_HVDCP" include/linux/power_supply.h || true

      - name: 2. Dump merlin.dts & mt6768 battery DTS
        run: |
          echo "=== arch/arm64/boot/dts/mediatek/merlin.dts (Lines 350-550) ==="
          nl -ba arch/arm64/boot/dts/mediatek/merlin.dts | sed -n '350,550p'
          echo "=== Search MT6768 battery prop dtsi ==="
          find arch/arm64/boot/dts/ -name "*6768*bat*" -o -name "*merlin*"
