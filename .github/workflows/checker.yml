name: Deep Check Kernel Bug Lines

on:
  workflow_dispatch:

jobs:
  deep-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Kernel Tree
        uses: actions/checkout@v4
        with:
          repository: 'mt6768-dev/android_kernel_xiaomi_mt6768'
          ref: 'lineage-23.2'
          fetch-depth: 1

      - name: 1. Dump power_supply_show_property & uevent
        run: |
          echo "=== drivers/power/supply/power_supply_sysfs.c (Lines 140-380) ==="
          nl -ba drivers/power/supply/power_supply_sysfs.c | sed -n '140,380p'

      - name: 2. Dump mtk_chg_type_det.c (Charger power_supply)
        run: |
          echo "=== drivers/power/supply/mediatek/charger/mtk_chg_type_det.c (Lines 290-620) ==="
          nl -ba drivers/power/supply/mediatek/charger/mtk_chg_type_det.c | sed -n '290,620p'

      - name: 3. Dump merlin.dts Charging & Battery Config
        run: |
          echo "=== arch/arm64/boot/dts/mediatek/merlin.dts (Lines 390-520) ==="
          nl -ba arch/arm64/boot/dts/mediatek/merlin.dts | sed -n '390,520p'
          
          echo "=== Finding Fuel Gauge / GM30 table in DTS ==="
          grep -rn -C 5 "R_FG_VALUE\|car_tune_value\|Q_MAX" arch/arm64/boot/dts/ || true
