name: Build merlin kernel (Lineage 23.2)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source (lineage-23.2)
        uses: actions/checkout@v4
        with:
          repository: mt6768-dev/android_kernel_xiaomi_mt6768
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Bersihkan EXTRAVERSION & localversion (Hapus cip-st)
        run: |
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          rm -f localversion*
          head -n 5 Makefile

      - name: Fix Kernel Panic & Charging Bugs (Power Supply & MTK Charger)
        run: |
          python3 - << 'PYEOF'
          import sys

          # 1. Fix power_supply_sysfs.c:
          #    - Urutan power_supply_type_text agar sinkron dengan enum power_supply_type di power_supply.h
          #    - Handle POWER_SUPPLY_PROP_BATTERY_TYPE (intval) supaya tidak dibaca sebagai strval pointer (0xffffffff00000002)
          #    - Guard null/invalid pointer pada MODEL_NAME .. SERIAL_NUMBER
          sysfs_path = "drivers/power/supply/power_supply_sysfs.c"
          s = open(sysfs_path).read()

          old_type_text = '''static const char * const power_supply_type_text[] = {
          \t"Unknown", "Battery", "UPS", "Mains", "USB",
          \t"USB_DCP", "USB_CDP", "USB_ACA", "USB_C",
          \t"USB_PD", "USB_PD_DRP", "BrickID",
          \t"USB_HVDCP", "USB_HVDCP_3", "USB_HVDCP_3P5", "Wireless", "USB_FLOAT",
          \t"BMS", "Parallel", "Main", "USB_C_UFP", "USB_C_DFP",
          \t"Charge_Pump",
          };'''

          new_type_text = '''static const char * const power_supply_type_text[] = {
          \t"Unknown", "Battery", "UPS", "Mains", "USB",
          \t"USB_DCP", "USB_CDP", "USB_ACA",
          \t"USB_HVDCP", "USB_HVDCP_3", "USB_HVDCP_3P5",
          \t"USB_C", "USB_PD", "USB_PD_DRP", "BrickID",
          \t"Wireless", "USB_FLOAT",
          \t"BMS", "Parallel", "Main", "USB_C_UFP", "USB_C_DFP",
          \t"Charge_Pump",
          };'''

          if old_type_text in s:
              s = s.replace(old_type_text, new_type_text, 1)
              print("[ok] power_supply_type_text disinkronkan")
          else:
              print("[warn] blok power_supply_type_text tidak persis sama, cek manual")

          old_str_case = '''\tcase POWER_SUPPLY_PROP_MODEL_NAME ... POWER_SUPPLY_PROP_SERIAL_NUMBER:
          \t\tret = sprintf(buf, "%s\\n", value.strval);
          \t\tbreak;'''

          new_str_case = '''\tcase POWER_SUPPLY_PROP_BATTERY_TYPE:
          \t\tif (value.intval >= 0 && value.intval < ARRAY_SIZE(power_supply_battery_type_text))
          \t\t\tret = sprintf(buf, "%s\\n", power_supply_battery_type_text[value.intval]);
          \t\telse
          \t\t\tret = sprintf(buf, "%s\\n", "Unknown");
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_CYCLE_COUNTS:
          \t\tret = sprintf(buf, "%d\\n", value.intval);
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_MODEL_NAME ... POWER_SUPPLY_PROP_MANUFACTURER:
          \tcase POWER_SUPPLY_PROP_SERIAL_NUMBER:
          \t\tif (!value.strval || IS_ERR((const void *)value.strval) || (unsigned long)value.strval < PAGE_SIZE)
          \t\t\tret = sprintf(buf, "\\n");
          \t\telse
          \t\t\tret = sprintf(buf, "%s\\n", value.strval);
          \t\tbreak;'''

          if old_str_case in s:
              s = s.replace(old_str_case, new_str_case, 1)
              print("[ok] power_supply_show_property string/int bug berhasil di-patch")
          else:
              print("[FAIL] gagal patch power_supply_show_property!")
              sys.exit(1)

          open(sysfs_path, "w").write(s)

          # 2. Fix mtk_chg_type_det.c:
          #    Pindahkan case POWER_SUPPLY_PROP_CONSTANT_CHARGE_CURRENT_MAX keluar dari switch (mtk_chg->chg_type) ke switch (psp)
          chg_path = "drivers/power/supply/mediatek/charger/mtk_chg_type_det.c"
          c = open(chg_path).read()

          old_chg_block = '''\t\tcase CHARGER_UNKNOWN:
          \t\t\tval->intval = POWER_SUPPLY_USB_TYPE_UNKNOWN;
          \t\t\tpr_info("%s: Charger Type: CHARGER_UNKNOWN\\n", __func__);
          \t\t\tbreak;
          \t\tcase POWER_SUPPLY_PROP_CONSTANT_CHARGE_CURRENT_MAX:
          \t\t\tval->intval = call_mode;
          \t\t\tbreak;
          \t\tdefault:
          \t\t\tbreak;
          \t\t}
          \t\tbreak;'''

          new_chg_block = '''\t\tcase CHARGER_UNKNOWN:
          \t\t\tval->intval = POWER_SUPPLY_USB_TYPE_UNKNOWN;
          \t\t\tpr_info("%s: Charger Type: CHARGER_UNKNOWN\\n", __func__);
          \t\t\tbreak;
          \t\tdefault:
          \t\t\tbreak;
          \t\t}
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_CONSTANT_CHARGE_CURRENT_MAX:
          \t\tval->intval = call_mode;
          \t\tbreak;'''

          if old_chg_block in c:
              c = c.replace(old_chg_block, new_chg_block, 1)
              open(chg_path, "w").write(c)
              print("[ok] mtk_chg_type_det.c CONSTANT_CHARGE_CURRENT_MAX dipindah ke switch(psp)")
          else:
              print("[FAIL] gagal patch mtk_chg_type_det.c!")
              sys.exit(1)
          PYEOF

      - name: Setup KernelSU-Next (Legacy) & Manual Hooks
        run: |
          rm -rf drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          python3 - << 'PYEOF'
          import re, sys

          failed = []

          def patch(path, pattern, make_repl, marker, required=True):
              s = open(path).read()
              if marker in s:
                  print(f"[skip] {path} sudah ada {marker}")
                  return
              new, n = re.subn(pattern, make_repl, s, count=1, flags=re.S)
              if n != 1:
                  tag = "FAIL" if required else "warn"
                  print(f"[{tag}] anchor nggak ketemu di {path} ({marker})")
                  if required:
                      failed.append(path)
                  return
              open(path, "w").write(new)
              print(f"[ok] {path}")

          # kernel/reboot.c
          patch("kernel/reboot.c",
                r"(SYSCALL_DEFINE4\(reboot,[^{]*\{\n)",
                lambda m: "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                          + m.group(1)
                          + "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n",
                "ksu_handle_sys_reboot")

          # fs/exec.c
          patch("fs/exec.c",
                r"(static int do_execveat_common\([^{]*\{\n)",
                lambda m: "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                          + m.group(1)
                          + "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n",
                "ksu_handle_execveat(&fd")

          # fs/read_write.c
          patch("fs/read_write.c",
                r"(ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\s*\{\s*ssize_t ret;\n)",
                lambda m: "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n"
                          + m.group(1)
                          + "\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n",
                "ksu_handle_vfs_read(&file")

          # drivers/input/input.c
          patch("drivers/input/input.c",
                r"(void input_event\(struct input_dev \*dev,[^{]*\{\s*unsigned long flags;\n)",
                lambda m: "extern bool ksu_input_hook __read_mostly;\n"
                          "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                          + m.group(1)
                          + "\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n",
                "ksu_handle_input_handle_event(&type")

          # fs/stat.c
          patch("fs/stat.c",
                r"(\tint error = -EINVAL;\n)",
                lambda m: m.group(1)
                          + "\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                          + "\tksu_handle_stat(&dfd, &filename, &flags);\n",
                "ksu_handle_stat(&dfd")

          # fs/open.c
          patch("fs/open.c",
                r"(long do_faccessat\(int dfd, const char __user \*filename, int mode\)\s*\{\n)",
                lambda m: "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                          + m.group(1)
                          + "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
                "ksu_handle_faccessat(&dfd", required=False)

          if failed:
              print("Patch wajib gagal di:", failed)
              sys.exit(1)
          PYEOF

          SEP=KernelSU-Next/kernel/selinux/sepolicy.c
          n=$(grep -c "LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)" $SEP || true)
          echo "guard KERNEL_VERSION(5, 0, 0) ditemukan: $n"
          if [ "$n" = "3" ]; then
            sed -i 's/LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)/LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)/' $SEP
            echo "[ok] sepolicy.c avtab guard dibalik"
          else
            echo "[FAIL] jumlah guard bukan 3, source KernelSU-Next berubah, cek manual"
            exit 1
          fi

      - name: DEBUG - Signature hook & diff patch
        if: always()
        run: |
          echo "===== Diff Power Supply & Charger Fix ====="
          git diff drivers/power/supply/ || true

          echo "===== Hasil inject KSU di source kernel ====="
          grep -n "ksu_handle\|ksu_input_hook" \
            kernel/reboot.c fs/exec.c fs/read_write.c fs/stat.c \
            fs/open.c drivers/input/input.c || true

      - name: Siapkan Fragment Config Vendor & Inject Droidspaces + KSUN + EROFS + TTL
        run: |
          mkdir -p arch/arm64/configs/vendor
          if [ -f arch/arm64/configs/merlin_defconfig ]; then
            cp arch/arm64/configs/merlin_defconfig arch/arm64/configs/vendor/mt6768_defconfig
          fi

          # Pastikan CONFIG_LOCALVERSION_AUTO mati agar tidak ada tambahan git hash / cip
          cat << 'EOF' > arch/arm64/configs/vendor/ksu.config
          # Custom Kernel Name (4.19.325-nekonyaw-salsachan-hyperos+)
          CONFIG_LOCALVERSION="-nekonyaw-salsachan-hyperos+"
          # CONFIG_LOCALVERSION_AUTO is not set

          # KERNELSU CONFIGURATION (MANUAL HOOK, NO KPROBES)
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KPROBES is not set

          # EROFS FILESYSTEM SUPPORT
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_XATTR=y
          CONFIG_EROFS_FS_POSIX_ACL=y
          CONFIG_EROFS_FS_SECURITY=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          CONFIG_LZ4HC_COMPRESS=y

          # TTL MODIFICATION / HL TARGET SUPPORT
          CONFIG_NETFILTER_XT_TARGET_HL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP_NF_MANGLE=y

          # DROIDSPACES CONFIGURATION
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IP_NF_NAT=y

          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: DEBUG - Isi fragment & build.sh
        if: always()
        run: |
          echo "===== build.sh ====="
          cat build.sh || true
          echo "===== Fragment KSU ====="
          grep -n "LOCALVERSION\|KSU\|KPROBES\|EROFS\|TTL\|HL" arch/arm64/configs/vendor/ksu.config || true

      - name: Eksekusi Kompilasi Kernel
        run: |
          chmod +x build.sh
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: DEBUG - Ringkasan error build
        if: always()
        run: |
          [ -f build.log ] || { echo "build.log nggak ada"; exit 0; }
          echo "===== semua baris error ====="
          grep -n "error:\|undefined reference\|No rule to make target\|Error [0-9]" build.log | head -60 || true
          echo "===== konteks error: pertama ====="
          n=$(grep -n "error:" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n>8?n-8:1)),$((n+20))p" build.log; else echo "nggak ada baris 'error:'"; fi

      - name: DEBUG - Cek .config hasil build
        if: always()
        run: |
          grep -n "LOCALVERSION\|KSU\|KPROBES\|EROFS\|ARCH_MTK_PROJECT" out/.config || echo "out/.config nggak ada"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            out/.config
          include-hidden-files: true
          if-no-files-found: warn

      - name: Package ke AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/device.name1=.*/device.name1=merlin/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=merlinx/g' anykernel/anykernel.sh

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
            [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img anykernel/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/
          fi

          cd anykernel
          zip -r9 ../nekonyaw-salsachan-hyperos-merlin.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: nekonyaw-salsachan-hyperos-merlin
          path: nekonyaw-salsachan-hyperos-merlin.zip
