name: Build merlin kernel (Lineage 23.2)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source (lineage-23.2)
        uses: actions/checkout@v4
        with:
          repository: mt6768-dev/android_kernel_xiaomi_mt6768
          ref: lineage-23.2
          fetch-depth: 1

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 zip unzip rsync kmod \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$PWD/clang/lib64:${LD_LIBRARY_PATH}" >> $GITHUB_ENV
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Bersihkan EXTRAVERSION & localversion (Hapus cip-st)
        run: |
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          rm -f localversion*
          head -n 5 Makefile

      - name: Fix Kernel Panic & Charging Bugs (Power Supply & MTK Charger) & Flashlight Makefile
        run: |
          python3 - << 'PYEOF'
          import os, re, sys

          # 1. Fix power_supply_sysfs.c
          sysfs_path = "drivers/power/supply/power_supply_sysfs.c"
          s = open(sysfs_path).read()

          old_type_text = '''static const char * const power_supply_type_text[] = {
          \t"Unknown", "Battery", "UPS", "Mains", "USB",
          \t"USB_DCP", "USB_CDP", "USB_ACA", "USB_C",
          \t"USB_PD", "USB_PD_DRP", "BrickID",
          \t"USB_HVDCP", "USB_HVDCP_3", "USB_HVDCP_3P5", "Wireless", "USB_FLOAT",
          \t"BMS", "Parallel", "Main", "USB_C_UFP", "USB_C_DFP",
          \t"Charge_Pump",
          };'''

          new_type_text = '''static const char * const power_supply_type_text[] = {
          \t"Unknown", "Battery", "UPS", "Mains", "USB",
          \t"USB_DCP", "USB_CDP", "USB_ACA",
          \t"USB_HVDCP", "USB_HVDCP_3", "USB_HVDCP_3P5",
          \t"USB_C", "USB_PD", "USB_PD_DRP", "BrickID",
          \t"Wireless", "USB_FLOAT",
          \t"BMS", "Parallel", "Main", "USB_C_UFP", "USB_C_DFP",
          \t"Charge_Pump",
          };'''

          if old_type_text in s:
              s = s.replace(old_type_text, new_type_text, 1)
              print("[ok] power_supply_type_text disinkronkan")
          else:
              print("[warn] blok power_supply_type_text tidak persis sama, cek manual")

          old_str_case = '''\tcase POWER_SUPPLY_PROP_MODEL_NAME ... POWER_SUPPLY_PROP_SERIAL_NUMBER:
          \t\tret = sprintf(buf, "%s\\n", value.strval);
          \t\tbreak;'''

          new_str_case = '''\tcase POWER_SUPPLY_PROP_BATTERY_TYPE:
          \t\tif (value.intval >= 0 && value.intval < ARRAY_SIZE(power_supply_battery_type_text))
          \t\t\tret = sprintf(buf, "%s\\n", power_supply_battery_type_text[value.intval]);
          \t\telse
          \t\t\tret = sprintf(buf, "%s\\n", "Unknown");
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_CYCLE_COUNTS:
          \t\tret = sprintf(buf, "%d\\n", value.intval);
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_MODEL_NAME ... POWER_SUPPLY_PROP_MANUFACTURER:
          \tcase POWER_SUPPLY_PROP_SERIAL_NUMBER:
          \t\tif (!value.strval || IS_ERR((const void *)value.strval) || (unsigned long)value.strval < PAGE_SIZE)
          \t\t\tret = sprintf(buf, "\\n");
          \t\telse
          \t\t\tret = sprintf(buf, "%s\\n", value.strval);
          \t\tbreak;'''

          if old_str_case in s:
              s = s.replace(old_str_case, new_str_case, 1)
              print("[ok] power_supply_show_property string/int bug berhasil di-patch")
          else:
              print("[FAIL] gagal patch power_supply_show_property!")
              sys.exit(1)

          open(sysfs_path, "w").write(s)

          # 2. Fix mtk_chg_type_det.c
          chg_path = "drivers/power/supply/mediatek/charger/mtk_chg_type_det.c"
          c = open(chg_path).read()

          old_chg_block = '''\t\tcase CHARGER_UNKNOWN:
          \t\t\tval->intval = POWER_SUPPLY_USB_TYPE_UNKNOWN;
          \t\t\tpr_info("%s: Charger Type: CHARGER_UNKNOWN\\n", __func__);
          \t\t\tbreak;
          \t\tcase POWER_SUPPLY_PROP_CONSTANT_CHARGE_CURRENT_MAX:
          \t\t\tval->intval = call_mode;
          \t\t\tbreak;
          \t\tdefault:
          \t\t\tbreak;
          \t\t}
          \t\tbreak;'''

          new_chg_block = '''\t\tcase CHARGER_UNKNOWN:
          \t\t\tval->intval = POWER_SUPPLY_USB_TYPE_UNKNOWN;
          \t\t\tpr_info("%s: Charger Type: CHARGER_UNKNOWN\\n", __func__);
          \t\t\tbreak;
          \t\tdefault:
          \t\t\tbreak;
          \t\t}
          \t\tbreak;
          \tcase POWER_SUPPLY_PROP_CONSTANT_CHARGE_CURRENT_MAX:
          \t\tval->intval = call_mode;
          \t\tbreak;'''

          if old_chg_block in c:
              c = c.replace(old_chg_block, new_chg_block, 1)
              open(chg_path, "w").write(c)
              print("[ok] mtk_chg_type_det.c CONSTANT_CHARGE_CURRENT_MAX dipindah ke switch(psp)")
          else:
              print("[FAIL] gagal patch mtk_chg_type_det.c!")
              sys.exit(1)

          # 3. Fix empty -D$(...) macro di drivers/misc/mediatek/flashlight/Makefile
          fl_mk = "drivers/misc/mediatek/flashlight/Makefile"
          if os.path.exists(fl_mk):
              mk_src = open(fl_mk).read()
              # Ganti pola -D$(VAR) menjadi $(if $(VAR),-D$(VAR)) agar tidak menghasilkan -D kosong
              mk_new = re.sub(r'(?<![\w])\-D(\$\([^)]+\))', r'$(if \1,-D\1)', mk_src)
              if mk_new != mk_src:
                  open(fl_mk, "w").write(mk_new)
                  print("[ok] flashlight/Makefile berhasil diamankan dari flag -D kosong")
          PYEOF

      - name: Setup KernelSU-Next (Legacy) & Manual Hooks
        run: |
          rm -rf drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          python3 - << 'PYEOF'
          import os, re, sys

          failed = []

          def patch(path, pattern, make_repl, marker, required=True):
              s = open(path).read()
              if marker in s:
                  print(f"[skip] {path} sudah ada {marker}")
                  return
              new, n = re.subn(pattern, make_repl, s, count=1, flags=re.S)
              if n != 1:
                  tag = "FAIL" if required else "warn"
                  print(f"[{tag}] anchor nggak ketemu di {path} ({marker})")
                  if required:
                      failed.append(path)
                  return
              open(path, "w").write(new)
              print(f"[ok] {path}")

          # kernel/reboot.c
          patch("kernel/reboot.c",
                r"(SYSCALL_DEFINE4\(reboot,[^{]*\{\n)",
                lambda m: "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                          + m.group(1)
                          + "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n",
                "ksu_handle_sys_reboot")

          # fs/exec.c
          patch("fs/exec.c",
                r"(static int do_execveat_common\([^{]*\{\n)",
                lambda m: "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                          + m.group(1)
                          + "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n",
                "ksu_handle_execveat(&fd")

          # fs/read_write.c
          patch("fs/read_write.c",
                r"(ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\s*\{\s*ssize_t ret;\n)",
                lambda m: "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n"
                          + m.group(1)
                          + "\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n",
                "ksu_handle_vfs_read(&file")

          # drivers/input/input.c
          patch("drivers/input/input.c",
                r"(void input_event\(struct input_dev \*dev,[^{]*\{\s*unsigned long flags;\n)",
                lambda m: "extern bool ksu_input_hook __read_mostly;\n"
                          "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                          + m.group(1)
                          + "\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n",
                "ksu_handle_input_handle_event(&type")

          # fs/stat.c
          patch("fs/stat.c",
                r"(\tint error = -EINVAL;\n)",
                lambda m: m.group(1)
                          + "\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                          + "\tksu_handle_stat(&dfd, &filename, &flags);\n",
                "ksu_handle_stat(&dfd")

          # fs/open.c
          patch("fs/open.c",
                r"(long do_faccessat\(int dfd, const char __user \*filename, int mode\)\s*\{\n)",
                lambda m: "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                          + m.group(1)
                          + "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
                "ksu_handle_faccessat(&dfd", required=False)

          if failed:
              print("Patch wajib gagal di:", failed)
              sys.exit(1)

          # Dinamis cek avtab.h kernel vs sepolicy.c KernelSU-Next (legacy)
          sep_path = "KernelSU-Next/kernel/selinux/sepolicy.c"
          avtab_path = "security/selinux/ss/avtab.h"
          if os.path.exists(sep_path) and os.path.exists(avtab_path):
              avtab_src = open(avtab_path).read()
              sep_src = open(sep_path).read()
              uses_flex_array = "flex_array" in avtab_src
              print(f"[info] Kernel avtab.h memakai flex_array: {uses_flex_array}")

              if not uses_flex_array:
                  sep_new = re.sub(
                      r"#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(\s*5\s*,\s*[01]\s*,\s*0\s*\)",
                      "#if 0",
                      sep_src
                  )
                  sep_new = re.sub(
                      r"#if\s+LINUX_VERSION_CODE\s*<\s*KERNEL_VERSION\(\s*4\s*,\s*\d+\s*,\s*0\s*\)",
                      "#if 0",
                      sep_new
                  )
                  if not os.path.exists("include/linux/flex_array.h"):
                      sep_new = sep_new.replace("#include <linux/flex_array.h>", "// #include <linux/flex_array.h>")
                  if sep_new != sep_src:
                      open(sep_path, "w").write(sep_new)
                      print("[ok] sepolicy.c disesuaikan untuk avtab non-flex_array (4.19 backport)")
                  else:
                      print("[info] sepolicy.c sudah kompatibel dengan avtab non-flex_array")
          PYEOF

      - name: Patch BPF & Netd Uname Spoof di kernel/sys.c
        run: |
          python3 - << 'PYEOF'
          import sys

          path = "kernel/sys.c"
          marker = "BPF / Netd Uname Spoof"

          s = open(path).read()

          if marker in s:
              print("[skip] kernel/sys.c sudah ter-patch")
              sys.exit(0)

          target = "\tmemcpy(&tmp, utsname(), sizeof(tmp));\n\tup_read(&uts_sem);\n"
          spoof = (
              "\tmemcpy(&tmp, utsname(), sizeof(tmp));\n"
              "\tup_read(&uts_sem);\n"
              "\t/* BPF / Netd Uname Spoof for Android 14/15/16/17 HyperOS */\n"
              "\tif (current_uid().val == 0 &&\n"
              "\t    (!strncmp(current->comm, \"bpfloader\", 9) ||\n"
              "\t     !strncmp(current->comm, \"netbpfload\", 10) ||\n"
              "\t     !strncmp(current->comm, \"netd\", 4))) {\n"
              "\t\tstrlcpy(tmp.release, \"5.10.0\", sizeof(tmp.release));\n"
              "\t}\n"
          )

          if target not in s:
              print("[FAIL] pola memcpy(&tmp, utsname()...) tidak ketemu di kernel/sys.c")
              sys.exit(1)

          open(path, "w").write(s.replace(target, spoof, 1))
          print("[ok] BPF spoof injected ke kernel/sys.c")
          PYEOF

          grep -n -B 3 -A 8 "BPF / Netd Uname Spoof" kernel/sys.c || true

      - name: Patch Thermal Sysfs (PowerInsight) & Relax MTK Throttling
        run: |
          python3 - << 'PYEOF'
          import os

          # 1. Expose /sys/class/thermal/thermal_message/board_sensor_temp & ambient_sensor_temp
          tcore = "drivers/thermal/thermal_core.c"
          if os.path.exists(tcore):
              c = open(tcore).read()
              if "board_sensor_temp" not in c and "static int __init thermal_init(void)" in c:
                  helper = '''
          static struct class *xiaomi_thermal_class;
          static ssize_t board_sensor_temp_show(struct class *class, struct class_attribute *attr, char *buf)
          {
          \tstruct thermal_zone_device *tz;
          \tint temp = 33000;
          \ttz = thermal_zone_get_zone_by_name("mtktsAP");
          \tif (!IS_ERR(tz) && tz->ops && tz->ops->get_temp) {
          \t\tif (tz->ops->get_temp(tz, &temp) == 0)
          \t\t\treturn sprintf(buf, "%d\\n", temp);
          \t}
          \treturn sprintf(buf, "%d\\n", temp);
          }
          static ssize_t ambient_sensor_temp_show(struct class *class, struct class_attribute *attr, char *buf)
          {
          \treturn board_sensor_temp_show(class, attr, buf);
          }
          static CLASS_ATTR_RO(board_sensor_temp);
          static CLASS_ATTR_RO(ambient_sensor_temp);
          '''
                  init_hook = '''
          \txiaomi_thermal_class = class_create(THIS_MODULE, "thermal_message");
          \tif (!IS_ERR(xiaomi_thermal_class)) {
          \t\tclass_create_file(xiaomi_thermal_class, &class_attr_board_sensor_temp);
          \t\tclass_create_file(xiaomi_thermal_class, &class_attr_ambient_sensor_temp);
          \t}
          '''
                  c = c.replace("static int __init thermal_init(void)", helper + "\nstatic int __init thermal_init(void)", 1)
                  c = c.replace("return 0;\n\nexit_netlink:", init_hook + "\n\treturn 0;\n\nexit_netlink:", 1)
                  open(tcore, "w").write(c)
                  print("[ok] Thermal sysfs nodes (board_sensor_temp & ambient_sensor_temp) injected")

          # 2. Relax aggressive MTK ATM throttling while keeping hardware critical trip point intact
          atm_path = "drivers/misc/mediatek/thermal/common/coolers/mtk_cooler_atm.c"
          if os.path.exists(atm_path):
              atm = open(atm_path).read()
              atm_new = atm.replace("75000", "90000").replace("80000", "92000")
              if atm_new != atm:
                  open(atm_path, "w").write(atm_new)
                  print("[ok] MTK ATM aggressive thermal threshold relaxed (critical trip preserved)")
          PYEOF

      - name: Backport MGLRU & Parallel kcompressd (IsHacker Blossom 4.19 Reference)
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote add blossom https://github.com/IsHacker-kernel/android_kernel_xiaomi_blossom || true
          git fetch --depth=300 blossom || true

          MGLRU_COMMITS=$(git log blossom/HEAD --grep="lru_gen\|MGLRU" --format="%H" --reverse 2>/dev/null || true)
          if [ -n "$MGLRU_COMMITS" ]; then
            echo "[info] Mencoba cherry-pick commit MGLRU dari blossom..."
            for c in $MGLRU_COMMITS; do
              if git cherry-pick --no-commit "$c" 2>/dev/null; then
                echo "[ok] Applied $c"
              else
                echo "[warn] Conflict pada $c, skip commit ini agar build tidak rusak"
                git checkout -- .
                git clean -fd
              fi
            done
          else
            echo "[info] Commit MGLRU spesifik tidak ditemukan di shallow history blossom, lanjut dengan source saat ini."
          fi

      - name: DEBUG - Signature hook & diff patch
        if: always()
        run: |
          echo "===== Diff Power Supply, Charger & Flashlight Fix ====="
          git diff drivers/power/supply/ drivers/misc/mediatek/flashlight/ || true

          echo "===== Diff BPF Spoof kernel/sys.c & Thermal ====="
          git diff kernel/sys.c drivers/thermal/ || true

          echo "===== Hasil inject KSU di source kernel ====="
          grep -n "ksu_handle\|ksu_input_hook" \
            kernel/reboot.c fs/exec.c fs/read_write.c fs/stat.c \
            fs/open.c drivers/input/input.c || true

      - name: Siapkan Fragment Config Vendor & Inject Droidspaces + KSUN + EROFS + TTL + HyperOS4 Fixes
        run: |
          mkdir -p arch/arm64/configs/vendor
          if [ -f arch/arm64/configs/merlin_defconfig ] && [ ! -f arch/arm64/configs/vendor/mt6768_defconfig ]; then
            cp arch/arm64/configs/merlin_defconfig arch/arm64/configs/vendor/mt6768_defconfig
          fi

          cat << 'EOF' > arch/arm64/configs/vendor/ksu.config
          # Custom Kernel Name (4.19.325-nekonyaw-salsachan-hyperos+)
          CONFIG_LOCALVERSION="-nekonyaw-salsachan-hyperos+"
          # CONFIG_LOCALVERSION_AUTO is not set

          # KERNELSU CONFIGURATION (MANUAL HOOK, NO KPROBES)
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KPROBES is not set

          # HYPEROS 4 OPTIMIZATIONS: NO ANDROID LMK (KEEP LINUX OOM), BOOTPROF, WIREGUARD, MGLRU
          # CONFIG_ANDROID_LOW_MEMORY_KILLER is not set
          # CONFIG_MTK_LMKD is not set
          CONFIG_MTK_BOOTPROF=y
          CONFIG_WIREGUARD=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y

          # EROFS FILESYSTEM SUPPORT
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_XATTR=y
          CONFIG_EROFS_FS_POSIX_ACL=y
          CONFIG_EROFS_FS_SECURITY=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          CONFIG_LZ4HC_COMPRESS=y

          # TTL MODIFICATION / HL TARGET SUPPORT
          CONFIG_NETFILTER_XT_TARGET_HL=y
          CONFIG_IP_NF_TARGET_TTL=y
          CONFIG_IP6_NF_TARGET_HL=y
          CONFIG_IP_NF_MANGLE=y

          # DROIDSPACES CONFIGURATION
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IP_NF_NAT=y

          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: DEBUG - Isi fragment & cek merlin.config
        if: always()
        run: |
          echo "===== Isi arch/arm64/configs/vendor/merlin.config ====="
          cat arch/arm64/configs/vendor/merlin.config || true
          echo "===== Fragment KSU ====="
          grep -n "LOCALVERSION\|KSU\|KPROBES\|EROFS\|TTL\|HL\|LOW_MEMORY\|WIREGUARD\|BOOTPROF\|LRU_GEN" arch/arm64/configs/vendor/ksu.config || true

      - name: Eksekusi Kompilasi Kernel
        run: |
          set -o pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"

          if [ -f build.sh ]; then
            echo "[info] Menjalankan build.sh bawaan repo..."
            chmod +x build.sh
            ./build.sh 2>&1 | tee build.log
          else
            echo "[info] build.sh tidak ditemukan, menjalankan kompilasi make langsung..."
            COMMON_FLAGS=(
              O=out
              ARCH=arm64
              CC=clang
              LD=ld.lld
              AR=llvm-ar
              NM=llvm-nm
              OBJCOPY=llvm-objcopy
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              CLANG_TRIPLE=aarch64-linux-gnu-
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            )

            make "${COMMON_FLAGS[@]}" vendor/mt6768_defconfig

            if [ -f arch/arm64/configs/vendor/merlin.config ]; then
              echo "[info] Menggabungkan arch/arm64/configs/vendor/merlin.config..."
              cat arch/arm64/configs/vendor/merlin.config >> out/.config
            fi

            echo "[info] Menggabungkan arch/arm64/configs/vendor/ksu.config..."
            cat arch/arm64/configs/vendor/ksu.config >> out/.config

            make "${COMMON_FLAGS[@]}" olddefconfig
            make -j"$(nproc --all)" "${COMMON_FLAGS[@]}" 2>&1 | tee build.log
          fi

      - name: DEBUG - Ringkasan error build
        if: always()
        run: |
          [ -f build.log ] || { echo "build.log nggak ada"; exit 0; }
          echo "===== semua baris error ====="
          grep -n "error:\|undefined reference\|No rule to make target\|Error [0-9]" build.log | head -60 || true
          echo "===== konteks error: pertama ====="
          n=$(grep -n "error:" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n>8?n-8:1)),$((n+20))p" build.log; else echo "nggak ada baris 'error:'"; fi

      - name: DEBUG - Cek .config hasil build
        if: always()
        run: |
          grep -n "LOCALVERSION\|KSU\|KPROBES\|EROFS\|ARCH_MTK_PROJECT\|LOW_MEMORY\|WIREGUARD\|BOOTPROF\|LRU_GEN" out/.config || echo "out/.config nggak ada"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            out/.config
          include-hidden-files: true
          if-no-files-found: warn

      - name: Package ke AnyKernel3 & Inject Overclock Scripts (English, Default OFF)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/device.name1=.*/device.name1=merlin/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=merlinx/g' anykernel/anykernel.sh

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
            [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img anykernel/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/
          else
            echo "[FAIL] Image kernel tidak ditemukan di out/arch/arm64/boot/!"
            exit 1
          fi

          # Inject overclock_enable & overclock_disable (Default OFF on boot)
          mkdir -p anykernel/ramdisk/overlay.d/sbin

          cat << 'EOF' > anykernel/ramdisk/overlay.d/sbin/overclock_enable
          #!/system/bin/sh
          if [ "$(id -u)" -ne 0 ]; then
              echo "[-] Error: Please run this command as root (su)."
              exit 1
          fi

          STATE_DIR="/data/local/tmp/oc_state"
          mkdir -p "$STATE_DIR"

          if [ ! -f "$STATE_DIR/saved" ]; then
              cat /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq > "$STATE_DIR/cpu_little_stock" 2>/dev/null
              cat /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq > "$STATE_DIR/cpu_big_stock" 2>/dev/null
              echo "1" > "$STATE_DIR/saved"
          fi

          LITTLE_OC=$(awk '{print $NF}' /sys/devices/system/cpu/cpufreq/policy0/scaling_available_frequencies 2>/dev/null)
          BIG_OC=$(awk '{print $NF}' /sys/devices/system/cpu/cpufreq/policy6/scaling_available_frequencies 2>/dev/null)

          [ -n "$LITTLE_OC" ] && echo "$LITTLE_OC" > /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq 2>/dev/null
          [ -n "$BIG_OC" ] && echo "$BIG_OC" > /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq 2>/dev/null

          if [ -f /proc/gpufreq/gpufreq_opp_freq ]; then
              GPU_TOP=$(grep -oE 'freq = [0-9]+' /proc/gpufreq/gpufreq_opp_dump 2>/dev/null | head -n1 | awk '{print $3}')
              [ -n "$GPU_TOP" ] && echo "$GPU_TOP" > /proc/gpufreq/gpufreq_opp_freq 2>/dev/null
          fi

          if command -v iw >/dev/null 2>&1; then
              iw dev wlan0 set txpower fixed 2000 2>/dev/null
          fi

          echo "========================================================"
          echo "[+] OVERCLOCK MODE ENABLED"
          echo "    - CPU Little Max : ${LITTLE_OC:-1800000} kHz"
          echo "    - CPU Big Max    : ${BIG_OC:-2000000} kHz"
          echo "    - GPU Max Freq   : Unlocked (Top OPP)"
          echo "    - Wi-Fi TX Power : Boosted (20 dBm)"
          echo "--------------------------------------------------------"
          echo "[!] HARDWARE SAFETY WARNING:"
          echo "    Using an external phone cooler is strongly advised"
          echo "    while Overclock Mode is active to prevent excessive"
          echo "    heat buildup and hardware degradation."
          echo "    (Note: Overclock resets to stock automatically on reboot)"
          echo "========================================================"
          EOF

          cat << 'EOF' > anykernel/ramdisk/overlay.d/sbin/overclock_disable
          #!/system/bin/sh
          if [ "$(id -u)" -ne 0 ]; then
              echo "[-] Error: Please run this command as root (su)."
              exit 1
          fi

          STATE_DIR="/data/local/tmp/oc_state"

          if [ -f "$STATE_DIR/saved" ]; then
              cat "$STATE_DIR/cpu_little_stock" > /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq 2>/dev/null
              cat "$STATE_DIR/cpu_big_stock" > /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq 2>/dev/null
          else
              echo 1800000 > /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq 2>/dev/null
              echo 2000000 > /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq 2>/dev/null
          fi

          if [ -f /proc/gpufreq/gpufreq_opp_freq ]; then
              echo 0 > /proc/gpufreq/gpufreq_opp_freq 2>/dev/null
          fi

          if command -v iw >/dev/null 2>&1; then
              iw dev wlan0 set txpower auto 2>/dev/null
          fi

          echo "========================================================"
          echo "[-] OVERCLOCK MODE DISABLED"
          echo "    All CPU, GPU, and TX power parameters have been"
          echo "    restored to safe stock frequencies."
          echo "========================================================"
          EOF

          cat << 'EOF' > anykernel/ramdisk/overlay.d/init.oc_safeguard.rc
          on property:sys.boot_completed=1
              write /sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq 1800000
              write /sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq 2000000
              write /proc/gpufreq/gpufreq_opp_freq 0
          EOF

          chmod 0755 anykernel/ramdisk/overlay.d/sbin/overclock_enable
          chmod 0755 anykernel/ramdisk/overlay.d/sbin/overclock_disable
          ln -sf overclock_enable anykernel/ramdisk/overlay.d/sbin/overlock_enable
          ln -sf overclock_disable anykernel/ramdisk/overlay.d/sbin/overlock_disable

          cd anykernel
          zip -r9 ../nekonyaw-salsachan-hyperos-merlin.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: nekonyaw-salsachan-hyperos-merlin
          path: nekonyaw-salsachan-hyperos-merlin.zip
