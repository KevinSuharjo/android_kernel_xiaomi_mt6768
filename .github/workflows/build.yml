name: Build merlin kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Kosongkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Bersihkan EXTRAVERSION di Makefile (Hapus cip-cip)
        run: |
          sed -i -E 's/^(EXTRAVERSION\s*=\s*).*/\1/' Makefile
          head -n 5 Makefile

      - name: Setup KernelSU Original (backslashxx)
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master

      - name: Fragment EROFS
        run: |
          mkdir -p arch/arm64/configs/vendor
          cat << 'EOF' > arch/arm64/configs/vendor/erofs.config
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1
          EOF

      - name: Inject KernelSU, DroidSpaces & Custom Name ke merlin.config
        run: |
          mkdir -p arch/arm64/configs/vendor
          touch arch/arm64/configs/vendor/merlin.config
          cat << 'EOF' >> arch/arm64/configs/vendor/merlin.config

          # Custom Kernel Name
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_LOCALVERSION="-nekonyaw-salsachan-creampie-hyperos"

          # KernelSU
          CONFIG_KSU=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y

          # DroidSpaces Requirements
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_VETH=y
          CONFIG_MACVLAN=y
          CONFIG_BRIDGE=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          EOF
          cat arch/arm64/configs/vendor/merlin.config

      - name: Patch eBPF / uname spoofing di kernel/sys.c
        run: |
          python3 - << 'PYEOF'
          with open("kernel/sys.c", "r") as f:
              code = f.read()

          spoof_code = """
          \t/* eBPF / netd version spoofing */
          \tif (strstr(current->comm, "bpfloader") ||
          \t    strstr(current->comm, "netbpfload") ||
          \t    strstr(current->comm, "netd") ||
          \t    strstr(current->comm, "system_server")) {
          \t\tstrscpy(tmp.release, "5.10.0-android12-9-g000000000000", sizeof(tmp.release));
          \t}
          """

          target = "memcpy(&tmp, utsname(), sizeof(tmp));\n\tup_read(&uts_sem);"
          if target in code and "bpfloader" not in code:
              code = code.replace(target, target + spoof_code)
              with open("kernel/sys.c", "w") as f:
                  f.write(code)
              print("sys.c successfully patched for eBPF spoofing!")
          else:
              print("sys.c already patched or target pattern not found.")
          PYEOF
          git diff kernel/sys.c || true

      - name: Build pakai build.sh
        run: |
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log || {
            echo "================ ERROR LOG ================"
            grep -E -C 3 "error:|fatal error:" build.log | tail -n 100 || tail -n 150 build.log
            exit 1
          }

      - name: Cek hasil .config
        run: |
          grep -E "^CONFIG_EROFS" out/.config || true
          grep -E "^CONFIG_KSU" out/.config || true
          grep -E "^CONFIG_LOCALVERSION" out/.config || true
          ls -lh out/arch/arm64/boot/
          zcat out/arch/arm64/boot/Image.gz | grep -a -c erofs || true

      - name: Kumpulkan hasil
        run: |
          mkdir -p result
          cp out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz result/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb result/ 2>/dev/null || true
          cp out/.config result/config
          cp build.log result/
          find out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' | xargs -I{} cp {} result/ 2>/dev/null || true
          ls -lh result

      - uses: actions/upload-artifact@v4
        with:
          name: merlin-kernel
          path: result/
