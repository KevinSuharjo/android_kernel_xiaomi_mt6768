name: Build merlin kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source (lineage-23.2-old)
        uses: actions/checkout@v4
        with:
          repository: KevinSuharjo/android_kernel_xiaomi_mt6768
          ref: lineage-23.2-old
          fetch-depth: 1

      - name: Kosongkan disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Ambil build.sh dari branch lineage-23.2-old
        run: |
          curl -LSs "https://raw.githubusercontent.com/KevinSuharjo/android_kernel_xiaomi_mt6768/lineage-23.2-old/build.sh" -o build.sh
          chmod +x build.sh

      - name: Bersihkan EXTRAVERSION di Makefile (Hapus cip-cip)
        run: |
          sed -i -E 's/^(EXTRAVERSION\s*=\s*).*/\1/' Makefile
          head -n 5 Makefile

      - name: Setup KernelSU-Next (Legacy)
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Siapkan Fragment Config Vendor & Inject Droidspaces + KSUN
        run: |
          # 1. Bikin direktori vendor yang dicari oleh build.sh
          mkdir -p arch/arm64/configs/vendor

          # 2. Salin merlin_defconfig sebagai basis mt6768_defconfig
          cp arch/arm64/configs/merlin_defconfig arch/arm64/configs/vendor/mt6768_defconfig

          # 3. Buat fragment merlin.config yang dipanggil build.sh
          cat << 'EOF' > arch/arm64/configs/vendor/merlin.config

          # Custom Kernel Name
          # CONFIG_LOCALVERSION_AUTO is not set
          CONFIG_LOCALVERSION="-nekonyaw-salsachan-creampiee!!"

          # ========================================================
          # KERNELSU-NEXT HOOK CONFIGURATION
          # ========================================================
          CONFIG_KSU=y
          CONFIG_KSU_HOOK_MODE=1
          CONFIG_KSU_HOOK_MANUAL=y
          CONFIG_KSU_SYSCALL_TABLE_HOOK=y
          CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y

          # DISABLE KPROBES TOTAL
          # CONFIG_KPROBES is not set
          # CONFIG_HAVE_KPROBES is not set
          # CONFIG_KRETPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set

          # DISABLE CFI & SHADOW CALL STACK
          # CONFIG_CFI is not set
          # CONFIG_CFI_CLANG is not set
          # CONFIG_SHADOW_CALL_STACK is not set

          # EROFS Support
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1

          # ========================================================
          # DROIDSPACES CONFIGURATIONS (Non-GKI 4.14)
          # ========================================================

          # IPC mechanisms
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Core namespace support & user namespace
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          # Seccomp support
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Control groups & limits
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CPUSETS=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          # Device filesystem & overlayfs
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Firmware loading
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Droidspaces Network Isolation Support (NAT/none/macvlan)
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_MACVLAN=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set

          # UFW / Fail2ban Core & Netfilter Matchers
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          EOF

      - name: Build pakai build.sh
        run: |
          ./build.sh 2>&1 | tee build.log || {
            echo "================ ERROR LOG ================"
            grep -E -C 3 "error:|fatal error:" build.log | tail -n 100 || tail -n 150 build.log
            exit 1
          }

      - name: Packaging dengan AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git -b master package-kernel
          cp out/arch/arm64/boot/Image.gz-dtb package-kernel/ || cp out/arch/arm64/boot/Image.gz package-kernel/
          cd package-kernel
          zip -r9 ../Custom_Kernel_Merlin_NekoChan.zip *

      - name: Kumpulkan hasil
        run: |
          mkdir -p result
          cp Custom_Kernel_Merlin_NekoChan.zip result/
          cp out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz result/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb result/ 2>/dev/null || true
          cp out/.config result/config
          cp build.log result/
          ls -lh result

      - uses: actions/upload-artifact@v4
        with:
          name: merlin-kernel-neko
          path: result/
