name: Build merlin kernel

on:
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: "Pasang KernelSU-Next (legacy)?"
        type: boolean
        default: true
      enable_mglru:
        description: "Aktifkan MGLRU (Multi-Gen LRU)?"
        type: boolean
        default: true
      enable_droidspaces:
        description: "Aktifkan DroidSpaces Kernel Configs?"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Kosongkan Disk Runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 git \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil Clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Patch BPF & Netd Spoof di kernel/sys.c
        run: |
          python3 - << 'EOF'
          import sys

          try:
              with open('kernel/sys.c', 'r') as f:
                  content = f.read()

              target = 'memcpy(&tmp, utsname(), sizeof(tmp));\n\tup_read(&uts_sem);'
              spoof = '''memcpy(&tmp, utsname(), sizeof(tmp));
          \tup_read(&uts_sem);

          \t/* BPF / Netd Uname Spoof for Android 14/15/16 HyperOS */
          \tif (current_uid().val == 0 &&
          \t    (!strncmp(current->comm, "bpfloader", 9) ||
          \t     !strncmp(current->comm, "netbpfload", 10) ||
          \t     !strncmp(current->comm, "netd", 4))) {
          \t\tstrlcpy(tmp.release, "5.10.0", sizeof(tmp.release));
          \t}'''

              if target in content:
                  content = content.replace(target, spoof, 1)
                  with open('kernel/sys.c', 'w') as f:
                      f.write(content)
                  print(">>> BERHASIL: BPF Spoof injected ke kernel/sys.c!")
              else:
                  print(">>> INFO: Pola target memcpy tidak ditemukan atau sudah ter-patch.")
          except Exception as e:
              print(f">>> ERROR saat patching sys.c: {e}")
              sys.exit(1)
          EOF
          grep -A 10 -B 2 "netbpfload" kernel/sys.c || true

      - name: Siapkan Direktori Fragment Config
        run: |
          mkdir -p arch/arm64/configs/vendor

      - name: Set Nama Kernel (Localversion) & EROFS
        run: |
          cat << 'EOF' > arch/arm64/configs/vendor/base_tweaks.config
          # Custom Kernel Name
          CONFIG_LOCALVERSION="-nekonyaw-salsachan-creampie!-hyperos"

          # Filesystem EROFS
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_EROFS_FS_CLUSTER_PAGE_LIMIT=1
          EOF

      - name: Konfigurasi Tweaks Baterai & Deep Sleep
        run: |
          cat << 'EOF' > arch/arm64/configs/vendor/power_battery.config
          # Power Management & Deep Sleep
          CONFIG_PM=y
          CONFIG_SUSPEND=y
          CONFIG_SUSPEND_FREEZER=y
          CONFIG_PM_AUTOSLEEP=y
          CONFIG_PM_WAKELOCKS=y
          CONFIG_PM_WAKELOCKS_LIMIT=100
          CONFIG_PM_DEBUG=n

          # CPU Idle & Energy Model
          CONFIG_CPU_IDLE=y
          CONFIG_ARM64_CPUIDLE=y
          CONFIG_CPU_IDLE_GOV_MENU=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
          CONFIG_ENERGY_MODEL=y
          CONFIG_POWER_SAVING_TICK=y
          EOF

      - name: Konfigurasi MGLRU (Multi-Gen LRU)
        if: ${{ inputs.enable_mglru }}
        run: |
          cat << 'EOF' > arch/arm64/configs/vendor/mglru.config
          # Multi-Gen LRU (MGLRU)
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_LRU_GEN_STATS=y
          EOF

      - name: Konfigurasi DroidSpaces
        if: ${{ inputs.enable_droidspaces }}
        run: |
          cat << 'EOF' > arch/arm64/configs/vendor/droidspaces.config
          # IPC mechanisms
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Core namespace support
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          # Seccomp
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Control groups
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          # Device & Overlay FS
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Firmware Loader
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Network Isolation & Netfilter
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_MACVLAN=y
          CONFIG_ANDROID_PARANOID_NETWORK=n

          # Netfilter xt matches
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          EOF

      - name: Pasang KernelSU-Next
        if: ${{ inputs.enable_ksu }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          cat << 'EOF' > arch/arm64/configs/vendor/ksu.config
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          EOF

      - name: Build Kernel dengan build.sh
        run: |
          export LOCALVERSION="-nekonyaw-salsachan-creampie!-hyperos"
          chmod +x build.sh
          ./build.sh 2>&1 | tee build.log | tail -n 150

      - name: Verifikasi Hasil .config & Output
        run: |
          echo "=== VERIFIKASI CONFIG ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_EROFS_FS|CONFIG_KSU|CONFIG_LRU_GEN|CONFIG_PID_NS" out/.config || true
          ls -lh out/arch/arm64/boot/

      - name: Kumpulkan Artifact Hasil Build
        run: |
          mkdir -p result
          cp out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz result/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb result/ 2>/dev/null || true
          cp out/.config result/config
          cp build.log result/
          find out/arch/arm64/boot/dts -name '*.dtb' -o -name '*.dtbo' | xargs -I{} cp {} result/ 2>/dev/null || true
          ls -lh result

      - name: Upload Artifact Kernel
        uses: actions/upload-artifact@v4
        with:
          name: merlin-kernel-custom
          path: result/
