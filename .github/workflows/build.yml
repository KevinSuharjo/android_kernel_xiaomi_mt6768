name: Build merlin kernel (Lineage 24.0)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source (lineage-24.0)
        uses: actions/checkout@v4
        with:
          repository: KevinSuharjo/android_kernel_xiaomi_mt6768
          ref: lineage-24.0
          fetch-depth: 1

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Bersihkan EXTRAVERSION di Makefile (Hapus cip-cip)
        run: |
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          head -n 5 Makefile

      - name: Setup KernelSU-Next (Legacy) & Manual Hooks
        run: |
          rm -rf drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          python3 - << 'PYEOF'
          import re, sys

          failed = []

          def patch(path, pattern, make_repl, marker, required=True):
              s = open(path).read()
              if marker in s:
                  print(f"[skip] {path} sudah ada {marker}")
                  return
              new, n = re.subn(pattern, make_repl, s, count=1, flags=re.S)
              if n != 1:
                  tag = "FAIL" if required else "warn"
                  print(f"[{tag}] anchor nggak ketemu di {path} ({marker})")
                  if required:
                      failed.append(path)
                  return
              open(path, "w").write(new)
              print(f"[ok] {path}")

          # Deklarasi extern selalu ditaruh tepat sebelum fungsi yang di-patch,
          # jadi tipe (size_t, loff_t, bool, __user, dll) sudah dikenal.

          # kernel/reboot.c  <-- ini yang dicek Kbuild KernelSU-Next
          patch("kernel/reboot.c",
                r"(SYSCALL_DEFINE4\(reboot,[^{]*\{\n)",
                lambda m: "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n"
                          + m.group(1)
                          + "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n",
                "ksu_handle_sys_reboot")

          # fs/exec.c : di 4.19 do_execveat_common cuma wrapper ke __do_execve_file
          patch("fs/exec.c",
                r"(static int do_execveat_common\([^{]*\{\n)",
                lambda m: "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
                          + m.group(1)
                          + "\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n",
                "ksu_handle_execveat(&fd")

          # fs/read_write.c
          patch("fs/read_write.c",
                r"(ssize_t vfs_read\(struct file \*file, char __user \*buf, size_t count, loff_t \*pos\)\s*\{\s*ssize_t ret;\n)",
                lambda m: "extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n"
                          + m.group(1)
                          + "\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);\n",
                "ksu_handle_vfs_read(&file")

          # drivers/input/input.c
          patch("drivers/input/input.c",
                r"(void input_event\(struct input_dev \*dev,[^{]*\{\s*unsigned long flags;\n)",
                lambda m: "extern bool ksu_input_hook __read_mostly;\n"
                          "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                          + m.group(1)
                          + "\n\tif (unlikely(ksu_input_hook))\n\t\tksu_handle_input_handle_event(&type, &code, &value);\n",
                "ksu_handle_input_handle_event(&type")

          # fs/stat.c : extern dideklarasi di dalam fungsi (block scope)
          patch("fs/stat.c",
                r"(\tint error = -EINVAL;\n)",
                lambda m: m.group(1)
                          + "\textern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n"
                          + "\tksu_handle_stat(&dfd, &filename, &flags);\n",
                "ksu_handle_stat(&dfd")

          # fs/open.c : faccessat (dipakai su compat), opsional
          patch("fs/open.c",
                r"(long do_faccessat\(int dfd, const char __user \*filename, int mode\)\s*\{\n)",
                lambda m: "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
                          + m.group(1)
                          + "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n",
                "ksu_handle_faccessat(&dfd", required=False)

          if failed:
              print("Patch wajib gagal di:", failed)
              sys.exit(1)
          PYEOF

          # Fix: guard avtab di KernelSU-Next legacy kebalik buat kernel 4.19.
          # Kernel <5.0 pakai flex_array (htable bukan array pointer biasa).
          SEP=KernelSU-Next/kernel/selinux/sepolicy.c
          n=$(grep -c "LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)" $SEP || true)
          echo "guard KERNEL_VERSION(5, 0, 0) ditemukan: $n"
          if [ "$n" = "3" ]; then
            sed -i 's/LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)/LINUX_VERSION_CODE >= KERNEL_VERSION(5, 0, 0)/' $SEP
            echo "[ok] sepolicy.c avtab guard dibalik"
          else
            echo "[FAIL] jumlah guard bukan 3, source KernelSU-Next berubah, cek manual"
            exit 1
          fi

      - name: DEBUG - Signature hook asli KernelSU-Next & hasil inject
        if: always()
        run: |
          echo "===== Deklarasi/definisi ksu_ di source KernelSU-Next ====="
          grep -rn "ksu_handle_\|ksu_input_hook" KernelSU-Next/kernel \
            --include=*.h --include=*.c | head -60 || true

          echo "===== Hasil inject di source kernel ====="
          grep -n "ksu_handle\|ksu_input_hook" \
            kernel/reboot.c fs/exec.c fs/read_write.c fs/stat.c \
            fs/open.c drivers/input/input.c kernel/sys.c || true

          echo "===== sepolicy.c avtab guard (178-222) ====="
          sed -n '178,222p' KernelSU-Next/kernel/selinux/sepolicy.c || true

          echo "===== Kbuild baris 195-215 ====="
          sed -n '195,215p' drivers/kernelsu/Kbuild || true

          echo "===== Diff yang berubah ====="
          git status --short || true
          git diff --stat || true

      - name: Siapkan Fragment Config Vendor & Inject Droidspaces + KSUN + EROFS
        run: |
          mkdir -p arch/arm64/configs/vendor
          if [ -f arch/arm64/configs/merlin_defconfig ]; then
            cp arch/arm64/configs/merlin_defconfig arch/arm64/configs/vendor/mt6768_defconfig
          fi

          # JANGAN timpa vendor/merlin.config (isi config device: LCM, sensor, touch, ARCH_MTK_PROJECT, dll).
          # build.sh otomatis merge vendor/ksu.config SETELAH merlin.config.
          cat << 'EOF' > arch/arm64/configs/vendor/ksu.config
          # Custom Kernel Name (Max total UTS_RELEASE 64 chars)
          CONFIG_LOCALVERSION="-salsachan"

          # KERNELSU CONFIGURATION (MANUAL HOOK, NO KPROBES)
          CONFIG_KSU=y
          # CONFIG_KSU_DEBUG is not set
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KPROBES is not set

          # EROFS FILESYSTEM SUPPORT
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_XATTR=y
          CONFIG_EROFS_FS_POSIX_ACL=y
          CONFIG_EROFS_FS_SECURITY=y
          CONFIG_EROFS_FS_ZIP=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          CONFIG_LZ4HC_COMPRESS=y

          # DROIDSPACES CONFIGURATION
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_IP_NF_NAT=y

          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: DEBUG - Isi fragment & build.sh
        if: always()
        run: |
          echo "===== build.sh ====="
          cat build.sh || true
          echo "===== Fragment KSU ====="
          echo "--- vendor/merlin.config (asli dari repo, harus utuh) ---"
          cat arch/arm64/configs/vendor/merlin.config || true
          echo "--- vendor/ksu.config (KSU/EROFS/Droidspaces) ---"
          grep -n "KSU\|KPROBES\|EROFS" arch/arm64/configs/vendor/ksu.config || true

      - name: Eksekusi Kompilasi Kernel
        run: |
          chmod +x build.sh
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: DEBUG - Ringkasan error build
        if: always()
        run: |
          [ -f build.log ] || { echo "build.log nggak ada"; exit 0; }
          echo "===== semua baris error ====="
          grep -n "error:\|undefined reference\|No rule to make target\|Error [0-9]" build.log | head -60 || true
          echo "===== konteks error: pertama ====="
          n=$(grep -n "error:" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n>8?n-8:1)),$((n+20))p" build.log; else echo "nggak ada baris 'error:'"; fi

      - name: DEBUG - Cek .config hasil build
        if: always()
        run: |
          grep -n "KSU\|KPROBES\|LTO\|CFI\|EROFS\|ARCH_MTK_PROJECT" out/.config || echo "out/.config nggak ada"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            out/.config
          include-hidden-files: true
          if-no-files-found: warn

      - name: Package ke AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/device.name1=.*/device.name1=merlin/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=merlinx/g' anykernel/anykernel.sh

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
            [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img anykernel/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/
          fi

          cd anykernel
          zip -r9 ../salsachan-ksun-nekopoieee-merlin.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: salsachan-ksun-nekopoieee-merlin
          path: salsachan-ksun-nekopoieee-merlin.zip
