name: Build merlin kernel (Lineage 24.0)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-24.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout kernel source (lineage-24.0)
        uses: actions/checkout@v4
        with:
          repository: KevinSuharjo/android_kernel_xiaomi_mt6768
          ref: lineage-24.0
          fetch-depth: 1

      - name: Kosongkan disk runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils curl \
            device-tree-compiler python3 zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil clang r416183b
        run: |
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          export LD_LIBRARY_PATH="$PWD/clang/lib64:$LD_LIBRARY_PATH"
          clang/bin/clang --version | head -1

      - name: Bersihkan EXTRAVERSION di Makefile (Hapus cip-cip)
        run: |
          sed -i -E 's/^(EXTRAVERSION\s*=\s*).*/\1/' Makefile
          head -n 5 Makefile

      - name: Setup KernelSU-Next (Legacy) & Manual Hooks
        run: |
          rm -rf drivers/kernelsu KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          # Inject manual hooks jika belum ada
          # 1. fs/exec.c
          if ! grep -q "ksu_handle_execveat" fs/exec.c; then
            echo "Injecting KSU hook into fs/exec.c..."
            sed -i '1i extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);' fs/exec.c
            sed -i '/ret = do_execveat_common(fd, filename, argv, envp, flags);/i \
            ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);' fs/exec.c
          fi

          # 2. fs/read_write.c
          if ! grep -q "ksu_handle_vfs_read" fs/read_write.c; then
            echo "Injecting KSU hook into fs/read_write.c..."
            sed -i '1i extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);' fs/read_write.c
            sed -i '/if (unlikely(!file->f_op->read_iter))/i \
            ksu_handle_vfs_read(&file, &buf, &count, &pos);' fs/read_write.c || \
            sed -i '/if (unlikely(!file->f_op->read_iter && !file->f_op->read))/i \
            ksu_handle_vfs_read(&file, &buf, &count, &pos);' fs/read_write.c
          fi

          # 3. fs/stat.c
          if ! grep -q "ksu_handle_stat" fs/stat.c; then
            echo "Injecting KSU hook into fs/stat.c..."
            sed -i '1i extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);' fs/stat.c
            sed -i '/int error = -EINVAL;/a \
            ksu_handle_stat(&dfd, &filename, &flags);' fs/stat.c || \
            sed -i '/int error;/a \
            ksu_handle_stat(&dfd, &filename, &flags);' fs/stat.c
          fi

          # 4. drivers/input/input.c
          if ! grep -q "ksu_input_hook" drivers/input/input.c; then
            echo "Injecting KSU hook into drivers/input/input.c..."
            sed -i '1i extern bool ksu_input_hook __read_mostly;' drivers/input/input.c
            sed -i '1i extern void ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);' drivers/input/input.c
            sed -i '/input_pass_values(dev, vals, count);/i \
            if (unlikely(ksu_input_hook)) { \
                int i; \
                for (i = 0; i < count; i++) \
                    ksu_handle_input_handle_event(&vals[i].type, &vals[i].code, &vals[i].value); \
            }' drivers/input/input.c
          fi

      - name: Siapkan Fragment Config Vendor & Inject Droidspaces + KSUN
        run: |
          mkdir -p arch/arm64/configs/vendor
          if [ -f arch/arm64/configs/merlin_defconfig ]; then
            cp arch/arm64/configs/merlin_defconfig arch/arm64/configs/vendor/mt6768_defconfig
          fi

          cat << 'EOF' > arch/arm64/configs/vendor/merlin.config
          # Custom Kernel Name
          CONFIG_LOCALVERSION="-salsachan-ksun-nekopoieee!!!"

          # KERNELSU CONFIGURATION (MANUAL HOOK, NO KPROBES)
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          # CONFIG_KPROBES is not set
          # CONFIG_HAVE_KPROBES is not set
          # CONFIG_KPROBE_EVENTS is not set

          # DROIDSPACES CONFIGURATION
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y

          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y

          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y

          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_MACVLAN=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF

      - name: Eksekusi Kompilasi Kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package ke AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/device.name1=.*/device.name1=merlin/g' anykernel/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=merlinx/g' anykernel/anykernel.sh

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
            [ -f out/arch/arm64/boot/dtb.img ] && cp out/arch/arm64/boot/dtb.img anykernel/
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image anykernel/
          fi

          cd anykernel
          zip -r9 ../salsachan-ksun-nekopoieee-merlin.zip * -x .git README.md *placeholder

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: salsachan-ksun-nekopoieee-merlin
          path: salsachan-ksun-nekopoieee-merlin.zip
