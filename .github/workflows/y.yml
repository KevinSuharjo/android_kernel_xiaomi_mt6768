name: Kernel SSH Debugger

on:
  workflow_dispatch:

jobs:
  ssh-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Tmate Mandiri & Jalankan SSH
        run: |
          curl -sL https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-amd64.tar.xz | tar -xJ -C /tmp
          sudo mv /tmp/tmate-2.4.0-static-linux-amd64/tmate /usr/local/bin/
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo "=========================================="
          echo "KONEKSI SSH ANDA:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo "WEB BROWSER TERMINAL:"
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "=========================================="
          while [ ! -f /tmp/stop ]; do sleep 2; done
