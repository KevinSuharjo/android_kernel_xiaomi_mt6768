name: Build nekonyaw-salsachan-hyperos (kernel-tree-7)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      KERNEL_NAME: nekonyaw-salsachan-hyperos

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zstd xz-utils \
            device-tree-compiler python3 zip unzip rsync kmod curl jq git patch \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ambil source kernel (4.14 / kernel-tree-7)
        run: |
          git clone --depth=1 -b kernel-tree-7 \
            https://github.com/KevinSuharjo/android_kernel_xiaomi_mt6768-s k

      - name: Clang r416183b
        run: |
          cd k
          git clone --depth=1 -b lineage-20.0 \
            https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$PWD/clang/lib64:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          ./clang/bin/clang --version | head -1

      - name: Bersihin EXTRAVERSION & localversion
        run: |
          cd k
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile
          rm -f localversion*
          head -n 5 Makefile

      - name: Setup KernelSU
        run: |
          cd k
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          echo "--- hook KSU ---"
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig

      - name: Patch cgroup (Droidspaces) + CPU PRO + GPU 1.1GHz
        run: |
          cd k

          # drivers/clocksource di-compile pakai -Werror (subdir-ccflags-y).
          # Turunin jadi warning biar unused-function gak jadi error.
          if [ -f drivers/clocksource/Makefile ]; then
            sed -i 's/-Werror/-Wno-error/' drivers/clocksource/Makefile
          fi

          python3 - <<'PY'
          p = "kernel/cgroup/cgroup.c"
          s = open(p).read()
          i = s.find("static int cgroup_add_file(")
          assert i >= 0, "cgroup_add_file gak ketemu"
          j = s.find("\n}\n", i)
          assert j > i
          func = s[i:j]
          anchor = "\treturn 0;"
          assert func.count(anchor) == 1, "anchor return 0 ambigu"
          inject = (
              "\t/* Droidspaces/LXC: restore prefixed cgroup file name */\n"
              "\tif (cft->ss && (cgrp->root->flags & CGRP_ROOT_NOPREFIX) &&\n"
              "\t    !(cft->flags & CFTYPE_NO_PREFIX)) {\n"
              "\t\tsnprintf(name, CGROUP_FILE_NAME_MAX, \"%s.%s\",\n"
              "\t\t\t cft->ss->name, cft->name);\n"
              "\t\tkernfs_create_link(cgrp->kn, name, kn);\n"
              "\t}\n"
              "\n"
              "\treturn 0;"
          )
          open(p, "w").write(s[:i] + func.replace(anchor, inject, 1) + s[j:])
          print("[ok] cgroup prefix patch")
          PY

          python3 - <<'PY'
          p = "drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768/mtk_cpufreq_platform.c"
          s = open(p).read()
          anchor = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{\n"
          assert anchor in s, "anchor get_cpu_level gak ketemu"
          inject = ('\tpr_info("CPUFREQ OC: force CPU_LEVEL_2 (PRO 2.0/2.202GHz)\\n");\n'
                    '\treturn CPU_LEVEL_2;\n')
          open(p, "w").write(s.replace(anchor, anchor + inject, 1))
          print("[ok] CPU PRO aktif")
          PY

          python3 - <<'PY'
          import re
          p = "drivers/misc/mediatek/base/power/mt6768/mtk_gpufreq_core.h"
          s = open(p).read()
          s = re.sub(r"(#define\s+SEG_GPU_DVFS_FREQ0\s+)\(1000000\)", r"\g<1>(1100000)", s)
          s = re.sub(r"(#define\s+SEG_GPU_DVFS_VOLT0\s+)\(95000\)",  r"\g<1>(100000)",  s)
          s = re.sub(r"(#define\s+SEG_GPU_DVFS_VSRAM0\s+)\(105000\)", r"\g<1>(110000)", s)
          open(p, "w").write(s)
          print("[ok] GPU 1.1GHz")
          PY

          grep -n "CGRP_ROOT_NOPREFIX" kernel/cgroup/cgroup.c | head -3
          grep -n "CPU_LEVEL_2 (PRO" drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6768/mtk_cpufreq_platform.c
          grep -n "SEG_GPU_DVFS_FREQ0" drivers/misc/mediatek/base/power/mt6768/mtk_gpufreq_core.h

      - name: Tulis config fragment
        run: |
          cd k
          mkdir -p arch/arm64/configs/vendor
          cat > arch/arm64/configs/vendor/nekonyaw.config <<'EOF'
          # ================= nama kernel =================
          CONFIG_LOCALVERSION="-nekonyaw-salsachan-hyperos"
