      - name: Generate config
        run: |
          cd k
          make O=out ARCH=arm64 defconfig
          cat arch/arm64/configs/merlin_defconfig       >> out/.config
          cat arch/arm64/configs/vendor/nekonyaw.config >> out/.config
          make O=out ARCH=arm64 olddefconfig 2>&1 | tee olddefconfig.log
          echo "===== config final ====="
          grep -E '^CONFIG_LOCALVERSION=|^CONFIG_IKCONFIG_PROC=|^CONFIG_MODVERSIONS=|^CONFIG_KSU=|^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=|^CONFIG_SYSVIPC=|^CONFIG_IPC_NS=|^CONFIG_DEVTMPFS=|^CONFIG_PREEMPT=|^CONFIG_IP_NF_IPTABLES=|^CONFIG_ARMV8_DEPRECATED=' out/.config
          echo "===== symbol yang di-drop ====="
          grep -i "unknown symbol\|not in final" olddefconfig.log || echo "(tidak ada yang drop)"

      - name: Build kernel
        run: |
          cd k
          set -o pipefail
          make -j"$(nproc --all)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb modules 2>&1 | tee build.log
          VER=$(make -s O=out ARCH=arm64 kernelrelease)
          echo "KERNEL_RELEASE=$VER" >> "$GITHUB_ENV"
          echo "kernel release: $VER"
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package kernel modules (zip KernelSU/Magisk)
        run: |
          cd k
          VER="$KERNEL_RELEASE"
          rm -rf modroot kmod
          mkdir -p "modroot/lib/modules/$VER"
          for m in bt_drv_connac1x connfem fmradio_drv_mt6631 fpsgo gps_drv \
                   met sla udc_lib wlan_drv_gen4m wmt_chrdev_wifi wmt_drv ; do
            f=$(find out -name "$m.ko" -print -quit)
            if [ -n "$f" ]; then cp "$f" "modroot/lib/modules/$VER/" ; else echo "[warn] $m.ko gak ke-build (builtin)"; fi
          done
          depmod -b modroot "$VER"
          (cd "modroot/lib/modules/$VER" && ls *.ko 2>/dev/null | xargs -r -n1 basename > modules.load)

          mkdir -p kmod/system/vendor/lib/modules
          cp "modroot/lib/modules/$VER/"*.ko            kmod/system/vendor/lib/modules/
          cp "modroot/lib/modules/$VER/modules.dep"     kmod/system/vendor/lib/modules/
          cp "modroot/lib/modules/$VER/modules.alias"   kmod/system/vendor/lib/modules/ 2>/dev/null || true
          cp "modroot/lib/modules/$VER/modules.softdep" kmod/system/vendor/lib/modules/ 2>/dev/null || true
          cp "modroot/lib/modules/$VER/modules.load"    kmod/system/vendor/lib/modules/
          cat > kmod/module.prop <<EOF2
          id=nekonyaw-kmod
          name=nekonyaw-kmod
          version=$VER
          versionCode=1
          author=kepin
          description=Kernel modules $VER (flash bareng boot.img)
          EOF2
          (cd kmod && zip -r9 ../nekonyaw-kmod.zip . -x '.git*')

      - name: Package AnyKernel3
        run: |
          cd k
          rm -rf anykernel
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/^device.name1=.*/device.name1=merlin/'  anykernel/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=merlinx/' anykernel/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          (cd anykernel && zip -r9 "../$KERNEL_NAME.zip" . -x '.git*' 'README.md' '*placeholder')
          ls -lh "$KERNEL_NAME.zip" nekonyaw-kmod.zip

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nekonyaw-build
          path: |
            k/nekonyaw-salsachan-hyperos.zip
            k/nekonyaw-kmod.zip
            k/build.log
            k/out/.config
            k/olddefconfig.log
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload ke gofile
        if: always()
        run: |
          cd k
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Link gofile" >> "$SUMMARY"
          if [ -n "${{ secrets.GOFILE_TOKEN }}" ]; then
            AUTH=(-F "token=${{ secrets.GOFILE_TOKEN }}")
            echo "(pakai token dari secrets)" >> "$SUMMARY"
          else
            AUTH=()
            echo "(guest upload)" >> "$SUMMARY"
          fi
          for f in "$KERNEL_NAME.zip" nekonyaw-kmod.zip ; do
            [ -f "$f" ] || { echo "skip $f (gak ada)"; continue; }
            LINK=""
            for i in 1 2 3 ; do
              SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name')
              [ -n "$SERVER" ] && [ "$SERVER" != "null" ] || { sleep 3; continue; }
              RESP=$(curl -s --retry 3 --retry-delay 2 "${AUTH[@]}" -F "file=@$f" "https://${SERVER}.gofile.io/contents/uploadfile")
              echo "$f [$i] server=$SERVER => $(echo "$RESP" | head -c 400)"
              LINK=$(echo "$RESP" | jq -r '.data.downloadPage // empty')
              [ -n "$LINK" ] && break
              sleep 5
            done
            if [ -n "$LINK" ]; then
              echo "- **$f** : $LINK" >> "$SUMMARY"
            else
              echo "- **$f** : GAGAL upload ke gofile (ambil dari artifact)" >> "$SUMMARY"
            fi
          done
